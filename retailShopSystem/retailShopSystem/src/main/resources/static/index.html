<!DOCTYPE html>
<html>
<head>
    <title>Retail Shop Inventory</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
            width: 90%;
        }

        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid gray;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        .delete-btn {
            background: red;
        }
    </style>
</head>
<body>

<h1>Inventory Management System</h1>

<div class="container">

    <h3>Add Product</h3>
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="quantity" placeholder="Quantity">
    <button onclick="addProduct()">Add Product</button>

    <h3>Update Quantity</h3>
    <input type="number" id="updateId" placeholder="Product ID">
    <input type="number" id="updateQuantity" placeholder="New Quantity">
    <button onclick="updateProduct()">Update</button>

    <h3>All Products</h3>
    <button onclick="loadProducts()">Refresh List</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>

</div>

<script>
    const API_URL = "http://localhost:8080/products";

    function addProduct() {
        const name = document.getElementById("name").value;
        const quantity = document.getElementById("quantity").value;

        fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, quantity })
        })
        .then(() => {
            alert("Product Added");
            loadProducts();
        });
    }

    function loadProducts() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById("productTable");
                table.innerHTML = "";

                data.forEach(product => {
                    table.innerHTML += `
                        <tr>
                            <td>${product.id}</td>
                            <td>${product.name}</td>
                            <td>${product.quantity}</td>
                            <td>
                                <button class="delete-btn" onclick="deleteProduct(${product.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    function updateProduct() {
        const id = document.getElementById("updateId").value;
        const quantity = document.getElementById("updateQuantity").value;

        fetch(`${API_URL}/${id}?quantity=${quantity}`, {
            method: "PUT"
        })
        .then(() => {
            alert("Updated");
            loadProducts();
        });
    }

    function deleteProduct(id) {
        fetch(`${API_URL}/${id}`, {
            method: "DELETE"
        })
        .then(() => {
            alert("Deleted");
            loadProducts();
        });
    }

    window.onload = loadProducts;
</script>

</body>
</html>
