<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Shop Inventory</title>
    <style>
        :root {
            --bg: #f3f7ff;
            --panel: #ffffff;
            --panel-alt: #eef4ff;
            --primary: #4361ee;
            --primary-dark: #2d3fc9;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dfe7ff;
            --shadow: 0 18px 45px rgba(30, 41, 59, 0.08);
        }

        :root[data-theme="dark"] {
            --bg: #0f172a;
            --panel: #111827;
            --panel-alt: #1f2937;
            --primary: #8aa2ff;
            --primary-dark: #6a84ff;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: #334155;
            --shadow: 0 18px 45px rgba(2, 6, 23, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #dfeafe 100%);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
        }

        :root[data-theme="dark"] body {
            background: linear-gradient(135deg, #020817 0%, #0f172a 100%);
        }

        .app-shell {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 20px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            padding: 20px 28px;
            box-shadow: var(--shadow);
        }

        :root[data-theme="dark"] .topbar {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(51, 65, 85, 0.9);
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(1.7rem, 2vw, 2.5rem);
        }

        .brand p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .refresh-btn, .primary-btn, .secondary-btn, .danger-btn, .theme-toggle {
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .refresh-btn, .secondary-btn, .theme-toggle {
            background: #edf2ff;
            color: var(--primary-dark);
        }

        :root[data-theme="dark"] .refresh-btn,
        :root[data-theme="dark"] .secondary-btn,
        :root[data-theme="dark"] .theme-toggle {
            background: #1f2937;
            color: #dbeafe;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), #6f7efd);
            color: #fff;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.25);
        }

        .danger-btn {
            background: linear-gradient(135deg, var(--danger), #f87171);
            color: white;
        }

        .refresh-btn:hover, .primary-btn:hover, .secondary-btn:hover, .danger-btn:hover, .theme-toggle:hover {
            transform: translateY(-1px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: var(--shadow);
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: clamp(1.8rem, 2vw, 2.6rem);
            font-weight: 700;
            margin: 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            margin-top: 26px;
        }

        .panel {
            background: var(--panel);
            border-radius: 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        :root[data-theme="dark"] .panel {
            background: var(--panel);
        }

        .panel h2 {
            margin: 0 0 20px;
            font-size: 1.35rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            border: 1px solid #d7e2ff;
            background: #f9fbff;
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        :root[data-theme="dark"] .form-group input {
            background: #0b1220;
            border-color: var(--border);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.12);
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .button-row > * {
            flex: 1;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
        }

        th, td {
            padding: 16px 14px;
            text-align: left;
            border-bottom: 1px solid #edf2ff;
        }

        th {
            background: #f5f8ff;
            color: var(--muted);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        :root[data-theme="dark"] th {
            background: #1f2937;
        }

        tbody tr:hover {
            background: #fafcff;
        }

        :root[data-theme="dark"] tbody tr:hover {
            background: #0f172a;
        }

        .status-pill {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-low {
            background: #fff1d6;
            color: #b45309;
        }

        .status-good {
            background: #dcfce7;
            color: #166534;
        }

        .row-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .row-actions button {
            padding: 8px 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .mini-btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .mini-btn-primary {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 24px;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            background: rgba(17, 24, 39, 0.92);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 860px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <h1>Retail Shop Inventory</h1>
                <p>Track stock levels and manage products quickly.</p>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()">🌙 Dark</button>
                <button class="refresh-btn" onclick="loadProducts()">Refresh</button>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Products</div>
                <p id="totalProducts" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <div class="stat-label">Units in Stock</div>
                <p id="totalUnits" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <div class="stat-label">Low Stock Items</div>
                <p id="lowStockCount" class="stat-value">0</p>
            </div>
        </section>

        <div class="layout">
            <aside class="panel">
                <h2>Add Product</h2>

                <div class="form-group">
                    <label for="name">Product name</label>
                    <input type="text" id="name" placeholder="e.g. Notebook" />
                </div>

                <div class="form-group">
                    <label for="quantity">Initial quantity</label>
                    <input type="number" id="quantity" min="0" placeholder="0" />
                </div>

                <div class="button-row">
                    <button class="primary-btn" onclick="addProduct()">Add Product</button>
                </div>

                <hr style="margin: 28px 0; border: 1px solid #edf2ff;" />

                <h2>Update Quantity</h2>

                <div class="form-group">
                    <label for="updateId">Product ID</label>
                    <input type="number" id="updateId" min="1" placeholder="Product ID" />
                </div>

                <div class="form-group">
                    <label for="updateQuantity">New quantity</label>
                    <input type="number" id="updateQuantity" min="0" placeholder="0" />
                </div>

                <div class="button-row">
                    <button class="secondary-btn" onclick="updateProduct()">Update Stock</button>
                </div>
            </aside>

            <main class="panel">
                <div class="table-controls">
                    <h2>Inventory List</h2>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>
                                    <button type="button" class="sort-btn" onclick="toggleQuantitySort()">
                                        Quantity <span id="quantitySortIndicator">↕</span>
                                    </button>
                                </th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="productTable"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const API_URL = "/products";
        const THEME_KEY = "retail-shop-theme";
        let currentProducts = [];
        let quantitySortDirection = "none";

        function applyTheme(theme) {
            const root = document.documentElement;
            const isDark = theme === "dark";
            root.setAttribute("data-theme", isDark ? "dark" : "light");
            const button = document.getElementById("themeToggle");
            if (button) {
                button.textContent = isDark ? "☀ Light" : "🌙 Dark";
            }
        }

        function toggleTheme() {
            const root = document.documentElement;
            const nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(nextTheme);
            localStorage.setItem(THEME_KEY, nextTheme);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(showToast.timeoutId);
            showToast.timeoutId = setTimeout(() => {
                toast.classList.remove("show");
            }, 2200);
        }

        function updateQuantitySortIndicator() {
            const indicator = document.getElementById("quantitySortIndicator");
            if (!indicator) return;
            indicator.textContent = quantitySortDirection === "asc" ? "↑" : quantitySortDirection === "desc" ? "↓" : "↕";
        }

        function toggleQuantitySort() {
            if (quantitySortDirection === "none" || quantitySortDirection === "desc") {
                quantitySortDirection = "asc";
            } else {
                quantitySortDirection = "desc";
            }
            updateQuantitySortIndicator();
            renderTable(currentProducts);
        }

        function renderStats(products) {
            const totalProducts = products.length;
            const totalUnits = products.reduce((sum, product) => sum + Number(product.quantity || 0), 0);
            const lowStockCount = products.filter(product => Number(product.quantity || 0) < 10).length;

            document.getElementById("totalProducts").textContent = totalProducts;
            document.getElementById("totalUnits").textContent = totalUnits;
            document.getElementById("lowStockCount").textContent = lowStockCount;
        }

        function renderTable(products) {
            const table = document.getElementById("productTable");
            table.innerHTML = "";

            if (!products.length) {
                table.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">No products available yet.</td>
                    </tr>
                `;
                return;
            }

            const sortedProducts = [...products].sort((a, b) => {
                const quantityA = Number(a.quantity || 0);
                const quantityB = Number(b.quantity || 0);

                if (quantitySortDirection === "asc") {
                    return quantityA - quantityB;
                }

                if (quantitySortDirection === "desc") {
                    return quantityB - quantityA;
                }

                return 0;
            });

            sortedProducts.forEach(product => {
                const quantity = Number(product.quantity || 0);
                const statusClass = quantity < 10 ? "status-low" : "status-good";
                const statusText = quantity < 10 ? "Low Stock" : "In Stock";

                table.innerHTML += `
                    <tr>
                        <td>#${product.id}</td>
                        <td>${product.name}</td>
                        <td>${quantity}</td>
                        <td><span class="status-pill ${statusClass}">${statusText}</span></td>
                        <td>
                            <div class="row-actions">
                                <button class="mini-btn-primary" onclick="quickUpdate(${product.id}, ${quantity + 5})">+5</button>
                                <button class="mini-btn-danger" onclick="deleteProduct(${product.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function loadProducts() {
            fetch(API_URL)
                .then(async response => {
                    if (!response.ok) {
                        throw new Error("Unable to load products");
                    }
                    return response.json();
                })
                .then(products => {
                    currentProducts = products;
                    renderStats(products);
                    renderTable(products);
                })
                .catch(error => {
                    showToast(error.message);
                    document.getElementById("productTable").innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">Failed to load inventory.</td>
                        </tr>
                    `;
                });
        }

        function addProduct() {
            const name = document.getElementById("name").value.trim();
            const quantity = Number(document.getElementById("quantity").value);

            if (!name) {
                showToast("Please enter a product name");
                return;
            }

            if (Number.isNaN(quantity) || quantity < 0) {
                showToast("Quantity must be 0 or more");
                return;
            }

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, quantity })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not add product");
                }
                document.getElementById("name").value = "";
                document.getElementById("quantity").value = "";
                showToast("Product added successfully");
                loadProducts();
            })
            .catch(error => showToast(error.message));
        }

        function updateProduct() {
            const id = Number(document.getElementById("updateId").value);
            const quantity = Number(document.getElementById("updateQuantity").value);

            if (!id || Number.isNaN(quantity) || quantity < 0) {
                showToast("Please enter a valid product ID and quantity");
                return;
            }

            fetch(`${API_URL}/${id}?quantity=${quantity}`, {
                method: "PUT"
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to update product");
                }
                document.getElementById("updateId").value = "";
                document.getElementById("updateQuantity").value = "";
                showToast("Stock updated");
                loadProducts();
            })
            .catch(error => showToast(error.message));
        }

        function quickUpdate(id, quantity) {
            fetch(`${API_URL}/${id}?quantity=${quantity}`, {
                method: "PUT"
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to update product");
                }
                showToast("Stock adjusted");
                loadProducts();
            })
            .catch(error => showToast(error.message));
        }

        function deleteProduct(id) {
            fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to delete product");
                }
                showToast("Product deleted");
                loadProducts();
            })
            .catch(error => showToast(error.message));
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem(THEME_KEY) || "light";
            applyTheme(savedTheme);
            loadProducts();
        };
    </script>
</body>
</html>
